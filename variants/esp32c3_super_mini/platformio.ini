[ESP32C3_SuperMini]
extends = esp32_base
board = seeed_xiao_esp32c3    ; replace with your exact board id if different
build_flags =
  ${esp32_base.build_flags}
  -I variants/esp32c3_super_mini
  -D ESP32_CPU_FREQ=80
  ; --- LoRa (E22) Pinout ---
  ; NOTE: Changed to resolve conflicts and use standard SPI pins for XIAO ESP32-C3
  -D P_LORA_SCLK=6   ; Standard Hardware SPI
  -D P_LORA_MOSI=7   ; Standard Hardware SPI
  -D P_LORA_MISO=2   ; Standard Hardware SPI
  -D P_LORA_NSS=7
  -D P_LORA_DIO_1=8
  -D P_LORA_BUSY=5
  -D P_LORA_RESET=3
  -D SX126X_TXEN=4
  -D SX126X_RXEN=1  ; MOVED from GPIO3 to GPIO1 to resolve conflict with RESET
  ; --- End LoRa Pinout ---
  -D PIN_BOARD_SDA=21
  -D PIN_BOARD_SCL=22
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D SX126X_RX_BOOSTED_GAIN=1
  -D LORA_TX_POWER=22
  -D SX126X_DIO2_AS_RF_SWITCH=true
  -D SX126X_DIO3_TCXO_VOLTAGE=1.8
  -D SX126X_CURRENT_LIMIT=140
build_src_filter = ${esp32_base.build_src_filter}
  +<../variants/esp32c3_super_mini>
lib_deps =
  ${esp32_base.lib_deps}

[env:ESP32C3_SuperMini_companion_radio_ble]
extends = ESP32C3_SuperMini
upload_port = /dev/ttyACM0
upload_speed = 460800
build_src_filter = ${ESP32C3_SuperMini.build_src_filter}
  +<../examples/companion_radio/*.cpp>
  +<helpers/esp32/*.cpp>
build_flags =
  ${ESP32C3_SuperMini.build_flags}
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D OFFLINE_QUEUE_SIZE=256
  -D ADVERT_NAME='"SuperMini BLE Companion"'
lib_deps =
  ${ESP32C3_SuperMini.lib_deps}
  ${esp32_ota.lib_deps}
  densaugeo/base64 @ ~1.4.0
